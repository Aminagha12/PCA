plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hamidi.forexrobot'
    compileSdk 34

    defaultConfig {
        applicationId "com.hamidi.forexrobot"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "3.0"
        buildConfigField "String", "BINANCE_API_KEY",
            "\"${System.getenv('BINANCE_API_KEY') ?: ''}\""
        buildConfigField "String", "BINANCE_SECRET_KEY",
            "\"${System.getenv('BINANCE_SECRET_KEY') ?: ''}\""
    }

    // ════════════════════════════════════════════════════════════════
    // SIGNING CONFIG — دا APK signed کوي، Play Protect یې نه پاکوي
    // ════════════════════════════════════════════════════════════════
    signingConfigs {
        release {
            storeFile     file("forexrobot.jks")
            storePassword System.getenv("KEY_STORE_PASSWORD") ?: "Hamidi2026ForexRobot"
            keyAlias      System.getenv("KEY_ALIAS")          ?: "forexrobot"
            keyPassword   System.getenv("KEY_PASSWORD")       ?: "Hamidi2026ForexRobot"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release   // ← Signed release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { buildConfig = true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.1'
}
