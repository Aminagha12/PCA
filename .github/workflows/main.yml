name: Build Signed Forex Robot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/
          /tmp/gradle-8.1.1/bin/gradle wrapper --gradle-version=8.1.1
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/forexrobot.jks \
            -alias forexrobot \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storepass Hamidi2026ForexRobot \
            -keypass Hamidi2026ForexRobot \
            -dname "CN=ForexRobot, OU=Hamidi, O=ForexRobotSignalBot, L=Kabul, C=AF"

      - name: Build Signed Release APK
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          KEY_STORE_PASSWORD: Hamidi2026ForexRobot
          KEY_ALIAS: forexrobot
          KEY_PASSWORD: Hamidi2026ForexRobot
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ForexRobot-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
